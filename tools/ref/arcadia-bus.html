<!doctype html>
<meta charset="utf-8">
<title>arcadia bus</title>
<!-- Сверка шины Arcadia (фейзер, хор, выход ×1.5) в браузере: прежний engine.js (tools/ref/arcadia-engine.js) с эталонным worklet рельефа
     против ядра t2d.wasm (мир XII, сухой выход) — оба в OfflineAudioContext, одни действия, одна случайность голосов (зерно ядра 0 → голоса 1,
     как у эталонного worklet без processorOptions). Страна — SEED0 у обоих (новую ядро растит по кускам — здесь её нет). Запускает
     tools/arcadia-bus.py; результат — window.__res. -->
<script type="module">
import { createModel, T_KEYS } from './arcadia-model.js';
import { createEngine } from './arcadia-engine.js';

const SR = 48000, SEC = 5;
const W3 = [['add', -0.4, -0.5, { mode: 1, fig: 1 }], ['add', 0.3, 0.2, { mode: 2, r: 0.3 }], ['add', 0.1, 0.6, { mode: 4, fig: 2 }]];
const CASES = {
  dry: [['fx', 'chorus', 0], ['fx', 'phaser', 0], ...W3],
  phaser: [['fx', 'chorus', 0], ['fx', 'phaser', 0.8], ...W3],
  chorus: [['fx', 'chorus', 0.9], ['fx', 'phaser', 0], ...W3],
  both: [['fx', 'phaser', 0.5], ['fx', 'wind', 0.5], ['fx', 'relief', 0.6], ...W3],
};
const FX = ['relief', 'pace', 'wind', 'chorus', 'phaser', 'spread', 'hall'];

async function ref(acts) {
  const ctx = new OfflineAudioContext(2, SR * SEC, SR);
  const T = { send: () => ctx.createGain() };
  const model = createModel(), eng = createEngine(T, model, 'ref');
  model.listen(eng.on);
  eng.build(ctx, ctx.destination);
  eng.start();
  while (!eng.ready) await new Promise((r) => setTimeout(r, 20));
  for (const [a, x, y, z] of acts) { if (a === 'fx') model.setFx(x, y); else if (a === 'add') model.addT(x, y, z); }
  await new Promise((r) => setTimeout(r, 100));           // сообщения дошли до worklet до первого блока
  const b = await ctx.startRendering();
  return [b.getChannelData(0), b.getChannelData(1)];
}

async function core(acts) {
  const ctx = new OfflineAudioContext(2, SR * SEC, SR);
  await ctx.audioWorklet.addModule('../../t2d-worklet.js');
  const wasm = await (await fetch('../../t2d.wasm')).arrayBuffer();
  const node = new AudioWorkletNode(ctx, 't2d', { numberOfInputs: 4, numberOfOutputs: 2, outputChannelCount: [2, 2], processorOptions: { wasm, seed: 0, worlds: [12] } });
  node.connect(ctx.destination, 1);
  await new Promise((r) => { node.port.onmessage = (e) => { if (e.data.t === 'ready') r(); }; });
  const act = (kind, i, a) => node.port.postMessage({ t: 'action', slot: 12, kind, i, a });
  let slot = 0;
  for (const [a, x, y, z] of acts) {
    if (a === 'fx') act(4, FX.indexOf(x), [y]);
    else if (a === 'add') { const o = { u: x, v: y, oct: 0, r: 0.16, fig: 0, mode: 2, sp: 0.22, lvl: 0.8, ...z }; act(0, slot++, T_KEYS.map((k) => o[k])); }
  }
  await new Promise((r) => setTimeout(r, 100));
  const b = await ctx.startRendering();
  return [b.getChannelData(0), b.getChannelData(1)];
}

const rmsDb = (x) => 10 * Math.log10(x.reduce((s, v) => s + v * v, 0) / x.length + 1e-30);
function bands(x) {                                       // энергия по октавам: среднее по окнам 4096 (Hann), DFT по бинам октавы
  const N = 4096, edges = [62, 125, 250, 500, 1000, 2000, 4000, 8000, 16000], out = new Array(edges.length - 1).fill(0);
  let wins = 0;
  for (let o = N; o + N <= x.length; o += N * 2) {
    wins++;
    for (let k = 1; k < N / 2; k++) {
      const f = (k * SR) / N, bi = edges.findIndex((e, i) => f >= e && f < edges[i + 1]);
      if (bi < 0) continue;
      let r = 0, q = 0;
      for (let n = 0; n < N; n += 2) { const w = 0.5 - 0.5 * Math.cos((2 * Math.PI * n) / N), a = (2 * Math.PI * k * n) / N; r += x[o + n] * w * Math.cos(a); q -= x[o + n] * w * Math.sin(a); }
      out[bi] += r * r + q * q;
    }
  }
  return out.map((e) => 10 * Math.log10(e / wins + 1e-30));
}

window.__res = (async () => {
  const res = {};
  for (const [name, acts] of Object.entries(CASES)) {
    const [rL, rR] = await ref(acts), [cL, cR] = await core(acts);
    let d = 0; for (let i = 0; i < rL.length; i++) d = Math.max(d, Math.abs(rL[i] - cL[i]), Math.abs(rR[i] - cR[i]));
    res[name] = { rms: [rmsDb(rL), rmsDb(cL), rmsDb(rR), rmsDb(cR)], bandsRef: bands(rL), bandsCore: bands(cL), maxDiff: d };
  }
  return res;
})();
</script>
