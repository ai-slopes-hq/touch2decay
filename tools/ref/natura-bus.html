<!doctype html>
<meta charset="utf-8">
<title>natura bus</title>
<!-- Сверка звука Natura в браузере: прежний engine.js (tools/ref/natura-engine.js — волны, фильтр с огибающей, шина, хор, лента-задержка, кораблик, лазер,
     лягушка, шелест на узлах Web Audio, часы по suspend каждые 25 мс) в OfflineAudioContext на 48 кГц. Сцена для ядра — состояние той же (эталонной)
     модели целиком (stateArgs) и список действий по времени. Страница отдаёт: state, acts и 4 канала (L, R, посыл L, посыл R) каждого случая float32
     в base64. Запускает tools/natura-bus.py; результат — window.__res. -->
<script type="module">
import { createModel } from './natura-model.js';
import { createEngine } from './natura-engine.js';
import { stateArgs } from './natura-state.js';
import { stepTime, due } from '../../host/midi.js';

const SR = 48000, SEC = 6;
const seeded = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const b64 = (f) => { const u = new Uint8Array(f.buffer); let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
const PAT = [[0, 2], [2, 7], [4, 5], [6, 11], [8, 4], [10, 9], [12, 0], [14, 12]];   // место, нота
// сцена с одним цветком; fx — поверх демо
const wave = (w, fx = {}) => (m) => { for (let i = 0; i < 16; i++) m.state.pads.at[i] = null; m.state.pads.len = 16; for (const [j, n] of PAT) m.state.pads.at[j] = { note: n, wave: w }; Object.assign(m.state.fx, { chance: 1 }, fx); };
// действия вне шагов: [время, событие модели, вид (ACT) , i, a] — в ядро идёт то же по номеру действия (tools/natura-bus.py)
const EXTRA = [[1.0, { t: 'laser' }, 8, 0, []], [2.0, { t: 'croak', pd: { note: 5 } }, 7, 0, [5]], [3.0, { shakeBy: 0.8 }, 22, 0, [0.8]],
  [4.5, { t: 'skiff', o: { t: 0.5, q: 0.1 } }, 4, 0, [0.1, 0.5, 0]], [5.4, { t: 'skiff', o: null }, 5, 0, []]];
const CASES = {
  sine: { setup: wave(0) }, square: { setup: wave(1) }, triangle: { setup: wave(2) }, saw: { setup: wave(3) }, sharp: { setup: wave(4) },
  mixed: { setup: (m) => { m.state.pads.len = 16; for (const [j, n] of PAT) m.state.pads.at[j] = { note: n, wave: (j / 2) % 5, glide: j % 4 === 2 }; } },
  fx: { setup: wave(3, { chorus: 1, delay: 0.9, time: 0.3, reverb: 0.9, res: 0.8, cutoff: 0.4, rel: 0.9, att: 0.3 }) },
  extras: { setup: wave(2), extra: true },
};

async function one(name, { setup, extra }) {
  const ctx = new OfflineAudioContext(4, SR * SEC, SR);
  const ticks = [];
  const sendSum = ctx.createGain();
  const T = { send: () => { const g = ctx.createGain(); g.connect(sendSum); return g; }, onTick: (fn) => ticks.push(fn), midiGrid: () => null, stepTime, due, scaleOn: false };
  const model = createModel({ rng: seeded(7) });
  setup(model);
  const eng = createEngine(T, model);
  model.listen(eng.on);
  const dry = ctx.createGain(), mg = ctx.createChannelMerger(4), ds = ctx.createChannelSplitter(2), ss = ctx.createChannelSplitter(2);
  dry.connect(ds); sendSum.connect(ss);
  ds.connect(mg, 0, 0); ds.connect(mg, 1, 1); ss.connect(mg, 0, 2); ss.connect(mg, 1, 3);
  mg.connect(ctx.destination);
  const state = stateArgs(model.state);
  eng.build(ctx, dry);
  model.play(true);
  const todo = extra ? EXTRA.map((e) => e.slice()) : [];
  for (let t = 0.025; t < SEC - 0.05; t += 0.025) ctx.suspend(t).then(() => {
    for (const f of ticks) f();
    model.tick(0.025);                                   // дерево затихает (τ 1.4 с) и шлёт события в прежний engine
    for (const e of todo) if (!e.done && ctx.currentTime >= e[0] - 1e-6) { e.done = true; if (e[1].shakeBy) model.shakeBy(e[1].shakeBy); else eng.on(e[1]); }
    ctx.resume();
  });
  const buf = await ctx.startRendering();
  return { state, acts: extra ? EXTRA.map((e) => [e[0], e[2], e[3], e[4]]) : [], ch: [0, 1, 2, 3].map((c) => b64(buf.getChannelData(c))) };
}

window.__res = (async () => { const o = {}; for (const [n, s] of Object.entries(CASES)) o[n] = await one(n, s); return o; })();
</script>
