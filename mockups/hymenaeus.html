<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hymenaeus · mockup</title>
<style>
  @font-face { font-family: 'IM Fell English'; font-style: normal; src: url(../fonts/im-fell-english-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IM Fell English'; font-style: italic; src: url(../fonts/im-fell-english-latin-400-italic.woff2) format('woff2'); }
  @font-face { font-family: 'EB Garamond'; font-style: italic; src: url(../fonts/eb-garamond-latin-400-italic.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Hymenaeus — статичный макет мира (без звука, не подключён к приложению).
// Rings → Clouds: жемчужная нить (Marbles) играет случайную мелодию, кольца звенят, звон уходит в облака.
const cv = document.getElementById('c'), g = cv.getContext('2d');
const INK = '237,237,237', GOLD = '214,182,118';
const ink = (a) => `rgba(${INK},${a})`, gold = (a) => `rgba(${GOLD},${a})`;
let W, H, S;                                    // S — масштаб от эталонного 390×844
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const TAU = Math.PI * 2;

function circle(x, y, r, st, lw) { g.strokeStyle = st; g.lineWidth = lw; g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke(); }
function dot(x, y, r, f) { g.fillStyle = f; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function txt(s, x, y, size, a, align = 'left', italic = false, fam = 'IM Fell English') {
  g.font = `${italic ? 'italic ' : ''}${size}px '${fam}'`; g.fillStyle = ink(a); g.textAlign = align; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
function star4(x, y, r, st) {                    // звёздочка-гравюра: нота в полёте
  g.strokeStyle = st; g.lineWidth = 1; g.beginPath();
  g.moveTo(x - r, y); g.lineTo(x + r, y); g.moveTo(x, y - r); g.lineTo(x, y + r);
  g.moveTo(x - r * .4, y - r * .4); g.lineTo(x + r * .4, y + r * .4); g.moveTo(x - r * .4, y + r * .4); g.lineTo(x + r * .4, y - r * .4);
  g.stroke();
}

// ---------- верхняя строка (как у всех миров) ----------
function topBar() {
  const y = 38;
  circle(26, y, 13, ink(.55), 1);
  g.strokeStyle = ink(.8); g.lineWidth = 1.3; g.beginPath(); g.moveTo(28.5, y - 5.5); g.lineTo(23, y); g.lineTo(28.5, y + 5.5); g.stroke();
  txt('Hymenaeus', 47, y - 2, 19, .92, 'left', true);
  g.strokeStyle = ink(.35); g.lineWidth = 1; g.beginPath(); g.moveTo(47, y + 13); g.lineTo(130, y + 13); g.stroke();
  const B = [[152, 'lad'], [194, 'steps'], [240, 'fx'], [285, 'dice'], [324, 'undo'], [363, 'trash']];
  for (const [x, k] of B) {
    const r = k === 'fx' ? 20 : 17;
    dot(x, y, r, 'rgba(10,10,10,.9)'); circle(x, y, r, ink(k === 'undo' ? .25 : .6), 1);
    g.strokeStyle = ink(k === 'undo' ? .3 : .85); g.lineWidth = 1.2; g.beginPath();
    if (k === 'lad') { g.moveTo(x - 6, y - 7); g.lineTo(x + 6, y - 7); g.moveTo(x - 1.5, y - 7); g.lineTo(x - 1.5, y + 8); g.moveTo(x + 1.5, y - 7); g.lineTo(x + 1.5, y + 8); }
    if (k === 'steps') { g.moveTo(x - 10, y + 7); for (let i = 0; i < 4; i++) { g.lineTo(x - 10 + i * 5, y + 7 - i * 4.5); g.lineTo(x - 5 + i * 5, y + 7 - i * 4.5); } }
    if (k === 'fx') { g.arc(x, y, 6, 0, TAU); g.moveTo(x + 11, y); g.arc(x, y, 11, 0, TAU); g.stroke(); g.strokeStyle = ink(.7); g.lineWidth = 2; g.beginPath(); g.arc(x, y, 25, -1.7, -0.25); }
    if (k === 'dice') { g.rect(x - 8, y - 8, 16, 16); g.stroke(); for (const [a, b] of [[-4, -4], [4, -4], [0, 0], [-4, 4], [4, 4]]) dot(x + a, y + b, 1.3, ink(.85)); g.beginPath(); }
    if (k === 'undo') { g.arc(x + 1, y + 1, 7, -2.6, 1.6); g.moveTo(x - 9, y - 7); g.lineTo(x - 5.5, y - 2.5); g.lineTo(x - 0.5, y - 5); }
    if (k === 'trash') { g.moveTo(x - 8, y - 6); g.lineTo(x + 8, y - 6); g.moveTo(x - 3, y - 6); g.lineTo(x - 3, y - 9); g.lineTo(x + 3, y - 9); g.lineTo(x + 3, y - 6); g.rect(x - 6, y - 6, 12, 15); g.moveTo(x - 2, y - 2); g.lineTo(x - 2, y + 6); g.moveTo(x + 2, y - 2); g.lineTo(x + 2, y + 6); }
    g.stroke();
  }
}

// ---------- небо ----------
function stars() {
  seed = 11;
  for (let i = 0; i < 70; i++) { const x = rnd() * W, y = 70 * S + rnd() * (H * .62); dot(x, y, rnd() < .1 ? .9 : .5, ink(.15 + rnd() * .35)); }
}

// облако — объединение кругов: контур только там, где дуга не внутри соседа; снизу — штриховка-тень
function cloud(cx, cy, scale, a, hatch = true, frozen = false) {
  seed = Math.round(cx * 7 + cy);
  const C = [];
  const n = 7;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1) - .5;
    C.push([cx + t * 120 * scale, cy - Math.cos(t * Math.PI) * 14 * scale + (rnd() - .5) * 8 * scale, (17 + Math.cos(t * Math.PI) * 15 + rnd() * 6) * scale]);
  }
  C.push([cx - 25 * scale, cy + 8 * scale, 20 * scale], [cx + 22 * scale, cy + 9 * scale, 19 * scale]);
  const inside = (x, y, j) => C.some(([X, Y, R], k) => k !== j && (x - X) ** 2 + (y - Y) ** 2 < R * R - .5);
  // штриховка снизу (тень) — клип по облаку
  if (hatch) {
    g.save(); g.beginPath(); for (const [X, Y, R] of C) { g.moveTo(X + R, Y); g.arc(X, Y, R, 0, TAU); } g.clip();
    const bot = Math.max(...C.map(([X, Y, R]) => Y + R)), top = Math.min(...C.map(([X, Y, R]) => Y - R));
    g.strokeStyle = ink(a * (frozen ? .55 : .22)); g.lineWidth = .8;
    const step = frozen ? 2.6 : 3.4;
    for (let y = frozen ? top : cy - 2 * scale; y < bot; y += step) {
      g.beginPath(); g.moveTo(cx - 90 * scale, y); g.lineTo(cx + 90 * scale, y + (frozen ? 0 : 1.5)); g.stroke();
    }
    g.restore();
  }
  g.strokeStyle = ink(a); g.lineWidth = 1.1;
  C.forEach(([X, Y, R], j) => {
    g.beginPath(); let on = false;
    for (let k = 0; k <= 90; k++) {
      const t = k / 90 * TAU, x = X + Math.cos(t) * R, y = Y + Math.sin(t) * R;
      if (inside(x, y, j)) { on = false; continue; }
      if (on) g.lineTo(x, y); else g.moveTo(x, y); on = true;
    }
    g.stroke();
  });
  return C;
}

function rice(x, y, n, spread, a) {             // зёрна — рисинки: короткие наклонные зёрнышки
  seed = Math.round(x * 3 + y * 5);
  for (let i = 0; i < n; i++) {
    const r = Math.sqrt(rnd()) * spread, t = rnd() * TAU, px = x + Math.cos(t) * r * 1.3, py = y + Math.sin(t) * r * .7;
    g.save(); g.translate(px, py); g.rotate(rnd() * Math.PI);
    g.strokeStyle = ink(a * (.5 + rnd() * .5)); g.lineWidth = 1.1;
    g.beginPath(); g.ellipse(0, 0, 2.4, .9, 0, 0, TAU); g.stroke(); g.restore();
  }
}

function clouds() {
  // буфер: левее — старее, правее — свежее; бледные повторы правее — эхо (feedback)
  cloud(105 * S, 175 * S, 1.0 * S, .55);
  cloud(285 * S, 250 * S, 1.15 * S, .8);
  cloud(310 * S, 254 * S, 1.15 * S, .16, false);             // эхо
  cloud(335 * S, 258 * S, 1.15 * S, .07, false);
  cloud(140 * S, 335 * S, .85 * S, .65, true, true);         // замороженное облако — freeze: плотная штриховка
  // позиция чтения — нить сверху вниз через облако
  const px = 262 * S;
  g.setLineDash([2, 4]); g.strokeStyle = ink(.35); g.lineWidth = 1;
  g.beginPath(); g.moveTo(px, 120 * S); g.lineTo(px, 300 * S); g.stroke(); g.setLineDash([]);
  g.save(); g.translate(px, 120 * S); g.rotate(Math.PI / 4); g.strokeStyle = ink(.8); g.lineWidth = 1.1; g.strokeRect(-3.5, -3.5, 7, 7); g.restore();
  // окно зерна (size) — скобки вокруг нити
  g.strokeStyle = ink(.5); g.lineWidth = 1;
  for (const sgn of [-1, 1]) { const x = px + sgn * 16 * S; g.beginPath(); g.moveTo(x - sgn * 4, 225 * S); g.lineTo(x, 225 * S); g.lineTo(x, 275 * S); g.lineTo(x - sgn * 4, 275 * S); g.stroke(); }
  rice(px, 250 * S, 34, 15 * S, .8);
  rice(150 * S, 330 * S, 10, 22 * S, .35);
}

// ---------- нити звука: ноты поднимаются от колец к облакам ----------
function threads() {
  const T = [[160, 600, 238, 300, .3, 2], [205, 605, 262, 300, .75, 1], [240, 612, 300, 300, .22, 3]];
  for (const [x0, y0, x1, y1, a, ph] of T) {
    g.strokeStyle = ink(a * .5); g.lineWidth = .9; g.beginPath();
    for (let i = 0; i <= 60; i++) {
      const t = i / 60, y = (y0 + (y1 - y0) * t) * S, w = Math.sin(t * 9 + ph) * 9 * t * S;
      const x = (x0 + (x1 - x0) * t * t) * S + w;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.stroke();
    // нота в полёте
    const t = .55 + ph * .08, y = (y0 + (y1 - y0) * t) * S, x = (x0 + (x1 - x0) * t * t) * S + Math.sin(t * 9 + ph) * 9 * t * S;
    star4(x, y, 4 + a * 3, gold(.4 + a * .6));
  }
}

// ---------- кольца (Rings) ----------
function band(cx, cy, R, w, a, hatch) {
  g.fillStyle = '#000'; g.beginPath(); g.arc(cx, cy, R + w / 2, 0, TAU); g.arc(cx, cy, R - w / 2, 0, TAU, true); g.fill();
  circle(cx, cy, R + w / 2, gold(a), 1.3); circle(cx, cy, R - w / 2, gold(a * .85), 1);
  if (hatch) {                                   // гравировка ободка: свет сверху-слева, тень — частой штриховкой
    g.lineWidth = .8;
    for (let k = 0; k < 160; k++) {
      const t = k / 160 * TAU, sh = .5 + .5 * Math.sin(t - 0.6);
      if (k % (sh > .6 ? 1 : 3)) continue;
      g.strokeStyle = gold(a * (.15 + sh * .35));
      g.beginPath(); g.moveTo(cx + Math.cos(t) * (R - w / 2 + 1), cy + Math.sin(t) * (R - w / 2 + 1)); g.lineTo(cx + Math.cos(t) * (R + w / 2 - 1), cy + Math.sin(t) * (R + w / 2 - 1)); g.stroke();
    }
  }
}
function rings() {
  const cy = 680 * S, R = 52 * S, w = 11 * S, A = [168 * S, cy], B = [226 * S, cy];
  // моды — концентрические волны внутри ударенного кольца (structure)
  for (let i = 1; i <= 4; i++) circle(A[0], A[1], R - w / 2 - i * 7 * S, gold(.22 / i), .8);
  for (let i = 1; i <= 2; i++) circle(B[0], B[1], R - w / 2 - i * 9 * S, gold(.08 / i), .8);   // сочувственные струны — слабее
  band(B[0], B[1], R, w, .6, true);
  band(A[0], A[1], R, w, .95, true);
  // сплетение: внизу B поверх A
  const dx = (B[0] - A[0]) / 2, hy = Math.sqrt(R * R - dx * dx);
  g.save(); g.beginPath(); g.arc(A[0] + dx, cy + hy, w * 1.7, 0, TAU); g.clip(); band(B[0], B[1], R, w, .6, true); g.restore();
  // место удара на ободе (яркость) — вспышка
  const ht = -2.3, hx = A[0] + Math.cos(ht) * (R + w / 2), hyy = A[1] + Math.sin(ht) * (R + w / 2);
  const gr = g.createRadialGradient(hx, hyy, 0, hx, hyy, 26 * S); gr.addColorStop(0, gold(.35)); gr.addColorStop(1, gold(0));
  g.fillStyle = gr; g.beginPath(); g.arc(hx, hyy, 26 * S, 0, TAU); g.fill();
  star4(hx, hyy, 7, gold(.95));
}

// ---------- жемчужная нить (Marbles): случайная мелодия; застёжка — déjà vu ----------
function necklace() {
  const cx = 197 * S, cy = 684 * S, rx = 142 * S, ry = 84 * S;
  const gap0 = -1.05, gap1 = -0.72;              // приоткрытая застёжка справа сверху: нить почти повторяется
  g.strokeStyle = ink(.35); g.lineWidth = .8; g.beginPath();
  for (let i = 0; i <= 200; i++) {
    const t = gap1 + i / 200 * (TAU - (gap1 - gap0)), x = cx + Math.cos(t) * rx, y = cy + Math.sin(t) * ry;
    if (i) g.lineTo(x, y); else g.moveTo(x, y);
  }
  g.stroke();
  // застёжка: два крючка
  for (const t of [gap0, gap1]) { const x = cx + Math.cos(t) * rx, y = cy + Math.sin(t) * ry; circle(x, y, 2.6, ink(.6), .9); }
  // жемчужины: 11 шагов, размер — высота ноты, пропуски — шанс (пустая бусина)
  seed = 3;
  const N = 11, cur = 7;
  for (let i = 0; i < N; i++) {
    const t = gap1 + .2 + i / (N - 1) * (TAU - (gap1 - gap0) - .4), x = cx + Math.cos(t) * rx, y = cy + Math.sin(t) * ry;
    const p = rnd(), rest = i === 3 || i === 9, r = (4.5 + p * 5) * S;
    if (rest) { circle(x, y, 2.2 * S, ink(.25), .8); continue; }
    dot(x, y, r, '#000');
    circle(x, y, r, ink(i === cur ? .95 : .55), 1);
    dot(x - r * .35, y - r * .35, Math.max(.7, r * .22), ink(i === cur ? .95 : .45));      // блик жемчуга
    if (i === cur) {
      const gr = g.createRadialGradient(x, y, 0, x, y, 20 * S); gr.addColorStop(0, ink(.22)); gr.addColorStop(1, ink(0));
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, 20 * S, 0, TAU); g.fill();
      // нить удара: от текущей жемчужины к месту на ободе кольца
      g.setLineDash([1.5, 3]); g.strokeStyle = gold(.55); g.lineWidth = .9;
      const ht = -2.3, R = 52 * S + 5.5 * S;
      g.beginPath(); g.moveTo(x, y); g.lineTo(168 * S + Math.cos(ht) * R, 680 * S + Math.sin(ht) * R); g.stroke(); g.setLineDash([]);
    }
  }
}

// ---------- факел Гименея в углу — выход на карту ----------
function torch() {
  const x = 356 * S, y = 828 * S;
  g.save(); g.translate(x, y); g.rotate(-0.32);
  // древко
  g.strokeStyle = ink(.7); g.lineWidth = 1.1;
  g.beginPath(); g.moveTo(-3, 0); g.lineTo(-4.5, -58 * S); g.lineTo(4.5, -58 * S); g.lineTo(3, 0); g.stroke();
  for (let i = 1; i < 6; i++) { g.beginPath(); g.moveTo(-4, -i * 9 * S - 2); g.lineTo(4, -i * 9 * S + 2); g.stroke(); }   // обмотка
  // чаша
  g.beginPath(); g.moveTo(-9 * S, -58 * S); g.lineTo(9 * S, -58 * S); g.lineTo(5 * S, -66 * S); g.lineTo(-5 * S, -66 * S); g.closePath(); g.stroke();
  // пламя — языки линиями, к центру карты (вверх-вправо)
  const fy = -66 * S;
  const gr = g.createRadialGradient(0, fy - 16 * S, 0, 0, fy - 16 * S, 44 * S); gr.addColorStop(0, gold(.3)); gr.addColorStop(1, gold(0));
  g.fillStyle = gr; g.beginPath(); g.arc(0, fy - 16 * S, 44 * S, 0, TAU); g.fill();
  g.strokeStyle = gold(.9); g.lineWidth = 1.1;
  const tongue = (w, h, k, a) => { g.strokeStyle = gold(a); g.beginPath(); g.moveTo(-w * S, fy); g.bezierCurveTo(-w * 1.4 * S, fy - h * .45 * S, k * S, fy - h * .6 * S, k * S, fy - h * S);
    g.bezierCurveTo(k * S + w * .2 * S, fy - h * .55 * S, w * 1.4 * S, fy - h * .4 * S, w * S, fy); g.stroke(); };
  tongue(8, 34, 3, .9); tongue(5, 24, -2, .7); tongue(3, 15, 1, .55);
  for (let i = 0; i < 4; i++) dot((-4 + i * 3.5) * S, fy - (40 + i * 6) * S, .8, gold(.5 - i * .1));   // искры
  g.restore();
}

// ---------- подписи макета (в игре — только пока тянешь) ----------
function labels() {
  if (!labelsOn) return;
  const L = [[262, 105, 'positio · granum', 'center'], [335, 285, 'echo', 'center'], [140, 392, 'glacies · freeze', 'center'],
             [197, 790, 'anuli', 'center'], [60, 600, 'margaritae', 'center'], [348, 612, 'déjà vu', 'center']];
  for (const [x, y, s, al] of L) txt(s, x * S, y * S, 13, .55, al, true, 'EB Garamond');
}

let labelsOn = true;
function draw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; S = Math.min(W / 390, H / 844);
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.save(); g.translate((W - 390 * S) / 2, (H - 844 * S) / 2);   // сцена по центру на широком экране
  stars(); clouds(); threads(); necklace(); rings(); torch(); labels();
  g.restore();
  topBar();
}
addEventListener('resize', draw);
cv.addEventListener('click', () => { labelsOn = !labelsOn; draw(); });   // тап — спрятать/показать подписи
document.fonts.load("italic 19px 'IM Fell English'").then(() => document.fonts.load("italic 13px 'EB Garamond'")).then(draw, draw);
draw();
</script>
</body>
</html>
