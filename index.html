<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="touch2decay">
<meta name="theme-color" content="#000000">
<title>touch2decay</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/im-fell-english-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/im-fell-english-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'IM Fell English'; font-style: italic; font-display: swap; src: url('fonts/im-fell-english-latin-400-italic.woff2') format('woff2'); }
  @font-face { font-family: 'IM Fell English'; font-style: normal; font-display: swap; src: url('fonts/im-fell-english-latin-400-normal.woff2') format('woff2'); }
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe-top { position: absolute; left: 0; top: 0; width: 1px; height: env(safe-area-inset-top, 0px); pointer-events: none; }
  #safe-bot { position: absolute; left: 0; bottom: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); pointer-events: none; }
</style>
<!-- Vercel Web Analytics: без cookies; для страницы без сборки — скрипт, а не npm-пакет -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<canvas id="field" aria-label="Synth field: touch to sound, drag to shape"></canvas>
<div id="safe-top"></div>
<div id="safe-bot"></div>
<script src="app.js?v=122"></script>
<script src="cymatica.js?v=122"></script>
<script src="laboratorium.js?v=122"></script>
<script src="natura.js?v=122"></script>
<script src="inferno.js?v=122"></script>
<script src="paradisus.js?v=122"></script>
<script src="monochord.js?v=122"></script>
<script src="oceanus.js?v=122"></script>
<script src="horologium.js?v=122"></script>
<script>
  // офлайн-кэш: только на настоящем сайте (https), не в превью и не с диска
  // новая версия: проверка при каждом возврате в приложение (иконка на «Домой» не перезапускается, а разворачивается);
  // пришла — страница перезагружается, но только когда ничего не звучит
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    const hadController = !!navigator.serviceWorker.controller;
    let pending = false;
    const quiet = () => !(window.t2d && t2d.sounding());   // молчат все миры
    const reloadWhenQuiet = () => { if (quiet()) location.reload(); else pending = true; };
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        if (pending) reloadWhenQuiet();
        else reg.update().catch(() => {});
      });
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) reloadWhenQuiet(); });
    setInterval(() => { if (pending && quiet()) location.reload(); }, 3000);
  }
</script>
</body>
</html>
