<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="touch2decay">
<meta name="theme-color" content="#000000">
<title>touch2decay</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --bg: #000; --ink: #ededed; --dim: #8c8c8c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud {
    position: absolute; left: 0; right: 0; top: 0; pointer-events: none;
    padding: calc(env(safe-area-inset-top) + 16px) 22px 0;
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  #hz { font-size: 44px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .unit { font-size: 13px; color: var(--dim); margin-left: 6px; }
  .stats { font-size: 12px; line-height: 1.55; color: var(--dim); text-align: right; }
  .stats span { color: var(--ink); }

  .axis { position: absolute; font-size: 11px; letter-spacing: 0.14em; color: var(--dim); pointer-events: none; }
  .ax-noise { right: 14px; top: calc(env(safe-area-inset-top) + 150px); }
  .ax-tone { right: 14px; bottom: calc(env(safe-area-inset-bottom) + 112px); }
  .ax-row {
    left: 22px; right: 22px; bottom: calc(env(safe-area-inset-bottom) + 50px);
    display: flex; justify-content: space-between;
  }

  #hint {
    position: absolute; left: 0; right: 0; top: 50%; text-align: center;
    font-size: 13px; letter-spacing: 0.24em; color: var(--dim);
    pointer-events: none; transition: opacity 1.2s;
  }

  #hold {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px);
    transform: translateX(-50%);
    width: 68px; height: 68px; padding: 0; border-radius: 50%;
    border: 1.5px solid #3a3a3a; background: rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, background-color 0.12s;
    touch-action: none;
  }
  #hold::after {
    content: ''; width: 10px; height: 10px; border-radius: 50%;
    background: #5a5a5a; transition: background-color 0.2s, transform 0.12s;
  }
  #hold.armed { border-color: var(--ink); }
  #hold.armed::after { background: var(--ink); }
  #hold.flash { background: var(--ink); }
  #hold.flash::after { background: var(--bg); transform: scale(1.6); }
  #hold:focus-visible { outline: 1px dashed var(--dim); outline-offset: 4px; }
</style>
</head>
<body>
<canvas id="field" aria-label="Поле: касание звучит, ведение пальцем меняет звук"></canvas>

<div id="hud">
  <div><span id="hz">—</span><span class="unit">Гц</span></div>
  <div class="stats">
    <div>шум <span id="v-noise">—</span></div>
    <div>срез <span id="v-cut">—</span></div>
    <div>биения <span id="v-beat">—</span></div>
    <div>резон <span id="v-fb">—</span></div>
  </div>
</div>

<div class="axis ax-noise">шум ↑</div>
<div class="axis ax-tone">тон ↓</div>
<div class="axis ax-row"><span>← глубже</span><span>выше →</span></div>

<div id="hint">коснись</div>

<button id="hold" aria-label="Держать: закрепить или отпустить пойманный кружок"></button>

<script src="app.js"></script>
</body>
</html>
