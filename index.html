<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="touch2decay">
<meta name="theme-color" content="#000000">
<title>touch2decay</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe-top { position: absolute; left: 0; top: 0; width: 1px; height: env(safe-area-inset-top, 0px); pointer-events: none; }
  #safe-bot { position: absolute; left: 0; bottom: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); pointer-events: none; }
</style>
</head>
<body>
<canvas id="field" aria-label="Поле синтезатора: касание звучит, ведение пальцем меняет звук"></canvas>
<div id="safe-top"></div>
<div id="safe-bot"></div>
<script src="app.js"></script>
</body>
</html>
