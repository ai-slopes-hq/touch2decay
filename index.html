<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="touch2decay">
<meta name="theme-color" content="#000000">
<title>touch2decay</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --bg: #000; --ink: #ededed; --dim: #8c8c8c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe-top { position: absolute; left: 0; top: 0; width: 1px; height: env(safe-area-inset-top, 0px); pointer-events: none; }

  .axis { position: absolute; font-size: 11px; letter-spacing: 0.14em; color: var(--dim); pointer-events: none; }
  .ax-noise { right: 14px; top: calc(env(safe-area-inset-top, 0px) + 74px); }
  .ax-tone { right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 46px); }
  .ax-row {
    left: 22px; right: 22px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    display: flex; justify-content: space-between;
  }

  #hint {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: 0.08em; color: var(--dim);
    pointer-events: none; transition: opacity 1.2s;
  }
  #hint b { font-weight: 400; font-size: 13px; letter-spacing: 0.24em; color: var(--ink); margin-bottom: 6px; }
  @media (prefers-reduced-motion: reduce) { #hint { transition: none; } }
</style>
</head>
<body>
<canvas id="field" aria-label="Поле синтезатора: касание звучит, ведение пальцем меняет звук"></canvas>
<div id="safe-top"></div>

<div class="axis ax-noise">шум ↑</div>
<div class="axis ax-tone">тон ↓</div>
<div class="axis ax-row"><span>← глубже</span><span>выше →</span></div>

<div id="hint">
  <b>коснись</b>
  <span>два тапа — закрепить</span>
  <span>держи кружок — свойства</span>
</div>

<script src="app.js"></script>
</body>
</html>
